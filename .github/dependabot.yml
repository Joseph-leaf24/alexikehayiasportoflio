# Dependabot: weekly pull requests that keep dependencies current. Each PR runs the
# full quality workflow before you merge it.
# Also turn on Settings → Code security → Dependabot alerts + security updates, so
# known vulnerabilities get a fix PR straight away rather than on the weekly run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than a week (time for a compromised publish to be pulled)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (React, Vite, ESLint, Tailwind, TypeScript …) need code changes,
      # so they are done by hand
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Base images in the Dockerfile (pinned by digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
