name: Code quality

# Runs on pull requests, on pushes to branches other than main, and from deploy.yml
# (which runs it on main and only deploys if every job passes):
#   • Website   — ESLint, TypeScript, unit tests with ≥ 80% coverage, npm audit
#   • Browser   — the built site in a real browser: Playwright smoke + axe
#                 accessibility tests (desktop + phone) and Lighthouse CI
#   • Workflows — actionlint (correctness) and zizmor (security) for .github/
#   • Docker    — hadolint, then the local container image builds, starts and serves
#                 the site (the image is for running locally; Pages doesn't use it)
#   • Python    — PEP 8 compliance (flake8) for the project code in Projects/
#   • Secrets   — fails if API keys, tokens or hard-coded passwords are committed
#
# Actions are pinned to full commit SHAs (the comment gives the version);
# Dependabot keeps them up to date (.github/dependabot.yml). When called from
# deploy.yml, the test, coverage, audit and Lighthouse numbers are passed back as
# outputs and published as the README badges (scripts/badges.mjs).

on:
  push:
    # main is checked by deploy.yml; Dependabot's branches by their pull requests
    branches-ignore: [main, "dependabot/**"]
  pull_request:
  workflow_call:
    outputs:
      passed:
        description: Unit tests passed
        value: ${{ jobs.website.outputs.passed }}
      failed:
        description: Unit tests failed
        value: ${{ jobs.website.outputs.failed }}
      coverage:
        description: Statement coverage (%)
        value: ${{ jobs.website.outputs.coverage }}
      vulnerabilities:
        description: Known vulnerabilities in shipped dependencies
        value: ${{ jobs.website.outputs.vulnerabilities }}
      lighthouse:
        description: Lowest Lighthouse score per category (JSON)
        value: ${{ jobs.browser.outputs.lighthouse }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when deploy.yml runs this, so the two never cancel each other
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website · lint, types, unit tests, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      coverage: ${{ steps.results.outputs.coverage }}
      vulnerabilities: ${{ steps.results.outputs.vulnerabilities }}
    steps:
      - name: Checkout (website source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            public
            scripts
            e2e

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check (site, configs and browser tests)
        run: npm run typecheck

      - name: Unit tests + coverage (fails below 80%)
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=coverage/test-results.json

      - name: Known vulnerabilities in shipped dependencies (fails on high / critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Known vulnerabilities in build tooling (report only)
        run: npm audit --audit-level=high || echo "::warning title=npm audit::Build-tool dependencies have high-severity advisories; merge Dependabot's update PRs"

      - name: Record the results for the README badges
        id: results
        run: node scripts/badges.mjs collect >> "$GITHUB_OUTPUT"

      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('coverage/coverage-summary.json')) process.exit(0);
            const t = require('./coverage/coverage-summary.json').total;
            const row = ['statements', 'branches', 'functions', 'lines'].map((k) => t[k].pct + '%').join(' | ');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### Unit test coverage\n| Statements | Branches | Functions | Lines |\n|---|---|---|---|\n| ' + row + ' |\n');
          "

  browser:
    name: Browser · e2e, accessibility, Lighthouse
    runs-on: ubuntu-latest
    # The runner draws the full-quality 3D scene in software (no GPU), so this job is slow
    timeout-minutes: 40
    outputs:
      lighthouse: ${{ steps.scores.outputs.lighthouse }}
    steps:
      - name: Checkout (website source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            public
            scripts
            e2e

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Install Chromium for Playwright
        # Headless runs only need the slimmer headless shell, not the full browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Smoke + accessibility tests (desktop and phone)
        run: npx playwright test

      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Accessibility, best practices and SEO must score ≥ 95; performance only warns
      # (runners have no GPU, so the WebGL scene renders in software). See lighthouserc.json.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Record the Lighthouse scores for the README badges
        id: scores
        run: node scripts/badges.mjs lighthouse .lighthouseci >> "$GITHUB_OUTPUT"

  docker:
    name: Docker · hadolint, image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (website source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            public
            docker

      - name: hadolint (Dockerfile best practices)
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

      - name: Build the image
        run: docker build -t alexi-portfolio:ci .

      - name: Start it the way compose.yaml does and check it serves the site
        run: |
          set -euo pipefail
          docker run -d --name site -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true alexi-portfolio:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' site)
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ] || { docker logs site; echo "::error::container never became healthy"; exit 1; }
          base=http://localhost:8080/alexikehayiasportoflio/
          html=$(curl -fsS "$base")
          bundle=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -1)
          curl -fsS -o /dev/null "$base$bundle"
          curl -fsS -o /dev/null "${base}Alexi_Kehayias_CV.pdf"
          headers=$(curl -fsSI "$base")
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          echo "Container is healthy and serves the site ($bundle)" >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflows · actionlint, zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (.github only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github

      # actionlint also runs shellcheck (preinstalled on the runner) on every `run:` script.
      # The release archive is verified against its published SHA-256 before it runs.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          ./actionlint -color

      - name: zizmor (workflow security audit)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Findings fail the job and show in the log (uploading them to code scanning
          # needs a paid plan on private repos)
          advanced-security: false

  python:
    name: Python · PEP 8 (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (Python files only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.flake8
            **/*.py

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: PEP 8 compliance
        run: flake8 . --count --show-source --statistics

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (text files only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            **/*.py
            **/*.ipynb
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.mjs
            **/*.cjs
            **/*.json
            **/*.md
            **/*.yml
            **/*.yaml
            **/*.env
            **/.env*
            **/.npmrc
            **/Dockerfile
            **/*.cfg
            **/*.toml
            **/*.ini
            **/*.txt
            **/*.html
            **/*.css
            **/*.sh
            **/*.urdf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Scan for committed credentials
        run: node scripts/scan-secrets.mjs .
