# nginx config for the local container (see Dockerfile). The site is served under
# /alexikehayiasportoflio/, the same path as on GitHub Pages.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Response headers GitHub Pages can't send (the CSP itself is a <meta> tag in index.html).
    # Defined only here, so every location below inherits them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /alexikehayiasportoflio/;
    }

    # The app uses hash routes, so any other path under the base falls back to index.html
    location /alexikehayiasportoflio/ {
        try_files $uri $uri/ /alexikehayiasportoflio/index.html;
    }

    # index.html must always be revalidated so a rebuild shows up straight away…
    location = /alexikehayiasportoflio/index.html {
        expires -1;
    }

    # …while the content-hashed build assets never change
    location /alexikehayiasportoflio/assets/ {
        expires 1y;
    }
}
